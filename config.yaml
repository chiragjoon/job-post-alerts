# Filters use "variant groups": each inner list is one logical thing to
# match (any variant in the group counts as a match). Matching is a broad,
# case-insensitive substring check -- start broad, tighten once you see
# what comes through. An empty list means "no filter" (matches everything).
filters:
  titles:
    - ["Engineer"]
  locations: []
